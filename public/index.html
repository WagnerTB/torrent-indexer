<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torrent Indexer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@heroicons/react/solid@2.0.0/dist/index.umd.js"></script>
</head>

<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col">
  <div class="container mx-auto p-6 flex-grow">
    <!-- Header -->
    <header class="text-center mb-10">
      <h1 class="text-4xl font-bold text-blue-400">Torrent Indexer 🇧🇷</h1>
      <p class="text-gray-400 mt-2">Find torrents with detailed information from torrent-indexer cache</p>
    </header>

    <!-- Search Bar -->
    <div class="flex justify-center mb-10">
      <input id="search-query" type="text" placeholder="Enter search query"
        class="w-full max-w-lg px-4 py-2 rounded-md border border-gray-600 bg-gray-800 text-white focus:ring focus:ring-blue-500">
      <button id="search-btn"
        class="ml-4 px-6 py-2 bg-blue-600 hover:bg-blue-700 rounded-md font-bold text-white">Search</button>
      <label class="flex items-center gap-2 ml-4 text-gray-300 whitespace-nowrap">
        <input id="only-with-seeds" type="checkbox" checked class="h-4 w-4">
        Only with seeds
      </label>
    </div>
    <div class="flex flex-wrap justify-center gap-3 mb-10">
      <select id="sort-by"
        class="px-3 py-2 rounded-md border border-gray-600 bg-gray-800 text-white">
        <option value="seeds">Mais seeds</option>
        <option value="date">Mais recentes</option>
        <option value="season">Temporada/Episódio</option>
        <option value="title">Título</option>
      </select>
      <select id="season-filter"
        class="px-3 py-2 rounded-md border border-gray-600 bg-gray-800 text-white">
        <option value="">Todas as temporadas</option>
      </select>
    </div>
    
    <!-- Results Section -->
    <div id="results" class="space-y-6 mb-10">
      <!-- Dynamic content will be injected here -->
    </div>

    <!-- Health Warning -->
    <div id="health-warning" class="hidden mb-6 p-4 bg-yellow-800 border border-yellow-600 rounded-lg">
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-9 4h18a2 2 0 002-2V7a2 2 0 00-2-2H3a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        <span class="font-bold text-yellow-400">Service Warning</span>
      </div>
      <p class="text-yellow-200 mt-2">Search functionality may be disabled or experiencing issues. Please try again later.</p>
    </div>

  </div>
  <!-- Stats Section -->
  <div id="database-statistics" class="stats-info mt-auto mb-1 p-3 rounded text-center">
    <span id="torrentStats" class="text-gray-400">Loading stats...</span>
  </div>

  <script>
    // Global variables
    let serviceHealthy = true;

    // Function to check service health
    async function checkHealth() {
      try {
        const response = await fetch('/search/health');
        const health = await response.json();
        
        if (response.status === 503 || health.status === 'unhealthy') {
          serviceHealthy = false;
          showHealthWarning();
          hideDatabaseStatistics();
        } else if (health.status === 'degraded') {
          serviceHealthy = true; // Still operational
          showHealthWarning(); // But show warning
        } else {
          serviceHealthy = true;
          hideHealthWarning();
        }
      } catch (error) {
        serviceHealthy = false;
        showHealthWarning();
        console.error('Health check failed:', error);
      }
    }

    // Function to show health warning
    function showHealthWarning() {
      document.getElementById('health-warning').classList.remove('hidden');
    }

    // Function to hide health warning
    function hideHealthWarning() {
      document.getElementById('health-warning').classList.add('hidden');
    }

    function hideDatabaseStatistics() {
      document.getElementById('database-statistics').classList.add('hidden');
    }

    // Function to load stats
    async function loadStats() {
      try {
        const response = await fetch('/search/stats');
        if (response.ok) {
          const stats = await response.json();
          const statsElement = document.getElementById('torrentStats');
          
          const formattedStats = `
              <span class="text-sm text-gray-500">
                <span class="text-green-400 font-medium">${stats.numberOfDocuments?.toLocaleString()+'+' || 'N/A'}</span> indexed torrents!
              </span>
          `;
          
          statsElement.innerHTML = formattedStats;
        } else {
          throw new Error('Failed to load stats');
        }
      } catch (error) {
        hideDatabaseStatistics();
        console.error('Stats loading failed:', error);
      }
    }

    // Function to render a single torrent result
    function renderTorrent(torrent) {
      const audio = Array.isArray(torrent.audio) ? torrent.audio.join(', ') : '';
      const season = torrent._season || torrent.season || 0;
      const episode = torrent._episode || torrent.episode || 0;
      const episodeBadge = season
        ? `<span class="ml-2 text-xs px-2 py-1 rounded bg-blue-900 text-blue-300">${episode
          ? `S${String(season).padStart(2, '0')}E${String(episode).padStart(2, '0')}`
          : `Temporada ${season}`}</span>`
        : '';
      return `
        <div class="p-6 bg-gray-800 rounded-lg shadow-md flex flex-col md:flex-row gap-6">
          <!-- Torrent Title and Details -->
          <div class="flex-grow">
            <h2 class="text-2xl font-bold text-blue-400 flex items-center gap-2">
              <span>${torrent.title || 'Sem título'}</span>
              <span class="text-sm text-gray-400">(${torrent.year || ''})</span>
              ${episodeBadge}
            </h2>
            <p class="text-gray-500 italic mt-1">${torrent.original_title || ''}</p>
            <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-4">
              <p><strong>Audio:</strong> ${audio}</p>
              <p><strong>Size:</strong> ${torrent.size || 'N/A'}</p>
              <p><strong>Seeds:</strong> ${torrent.seed_count || 0} | <strong>Leeches:</strong> ${torrent.leech_count || 0}</p>
              <p><strong>Info Hash:</strong> <span class="text-sm break-all text-gray-300">${torrent.info_hash || ''}</span></p>
            </div>
          </div>

          <!-- Actions -->
          <div class="flex flex-col justify-between items-start md:items-end">
            <div>
              <a href="${torrent.imdb || '#'}" target="_blank"
                class="flex items-center gap-2 text-blue-500 hover:text-blue-400 font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 16l-4-4m0 0l4-4m-4 4h16" />
                </svg>
                View on IMDB
              </a>
              <a href="${torrent.details || '#'}" target="_blank"
                class="flex items-center gap-2 text-blue-500 hover:text-blue-400 font-medium mt-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13 16h-1v-4h-.01M9 20h6a2 2 0 002-2v-5a2 2 0 00-2-2h-3.5a2 2 0 00-1.85 1.19M13 10V6a3 3 0 00-6 0v4" />
                </svg>
                View Details
              </a>
            </div>
            <a href="${torrent.magnet_link || '#'}" target="_blank"
              class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-bold rounded-md flex items-center gap-2 mt-4">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 17v-6m6 6v-6m-6 6l-2-2m8 0l2-2M5 9l7-7 7 7" />
              </svg>
              Download Magnet
            </a>
          </div>
        </div>
      `;
    }

    const LIVE_INDEXERS = [
      'torrent-dos-filmes',
      'rede_torrent',
      'starck-filmes',
      'comando_torrents'
    ];

    async function fetchLiveIndexer(indexer, query, onlyWithSeeds) {
      const minSeedsParam = onlyWithSeeds ? '&min_seeds=1' : '';
      const url = `/indexers/${indexer}?q=${encodeURIComponent(query)}&filter_results=true&limit=50${minSeedsParam}`;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 60000);
      try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) {
          return [];
        }
        const data = await response.json();
        return (data.results || []).map((item) => ({ ...item, source: indexer }));
      } catch (error) {
        console.warn(`Live search failed for ${indexer}`, error);
        return [];
      } finally {
        clearTimeout(timer);
      }
    }

    async function liveSearch(query, onlyWithSeeds) {
      const lists = await Promise.all(
        LIVE_INDEXERS.map((indexer) => fetchLiveIndexer(indexer, query, onlyWithSeeds))
      );
      const merged = [];
      const seen = new Set();
      for (const list of lists) {
        for (const item of list) {
          const key = item.info_hash || item.magnet_link;
          if (key && seen.has(key)) {
            continue;
          }
          if (key) {
            seen.add(key);
          }
          merged.push(item);
        }
      }
      merged.sort((a, b) => (b.seed_count || 0) - (a.seed_count || 0));
      return merged;
    }

    function showLoading(message) {
      document.getElementById('results').innerHTML = `
        <div class="p-6 bg-gray-800 rounded-lg shadow-md text-center">
          <p class="text-xl font-bold text-blue-400">${message}</p>
          <p class="text-gray-500 mt-2">Isso pode levar alguns segundos.</p>
        </div>
      `;
    }

    let currentResults = [];
    let currentIsLive = false;

    function parseSeasonEpisode(title) {
      const text = title || '';
      let match = text.match(/\bS(\d{1,2})[\s._-]*E(\d{1,3})\b/i);
      if (match) {
        return { season: parseInt(match[1], 10), episode: parseInt(match[2], 10), type: 'episode' };
      }
      match = text.match(/\b(\d{1,2})x(\d{1,2})\b/i);
      if (match) {
        return { season: parseInt(match[1], 10), episode: parseInt(match[2], 10), type: 'episode' };
      }

      let season = 0;
      match = text.match(/(?:temporada|season)\s*(\d{1,2})\b/i);
      if (match) {
        season = parseInt(match[1], 10);
      } else {
        match = text.match(/\b(\d{1,2})\s*[ªa]?\s*temporada\b/i);
        if (match) {
          season = parseInt(match[1], 10);
        }
      }
      if (!season) {
        match = text.match(/\bS(\d{1,2})\b/i);
        if (match) {
          season = parseInt(match[1], 10);
        }
      }

      let episode = 0;
      match = text.match(/\b(?:epis[oó]dio|ep\.?)\s*(\d{1,3})\b/i);
      if (match) {
        episode = parseInt(match[1], 10);
      }

      if (/\b(?:temporada\s+completa|season\s+complete|complete\s+season|s[eé]rie\s+completa|complete\s+series)\b/i.test(text)) {
        return { season, episode: 0, type: season ? 'season' : 'series' };
      }
      if (episode) {
        return { season, episode, type: 'episode' };
      }
      if (season) {
        return { season, episode: 0, type: 'season' };
      }
      return { season: 0, episode: 0, type: '' };
    }

    function prepareResult(item) {
      const parsed = parseSeasonEpisode(item.title || item.original_title || '');
      return {
        ...item,
        _season: Number(item.season) || parsed.season || 0,
        _episode: Number(item.episode) || parsed.episode || 0,
        _releaseType: item.release_type || parsed.type || ''
      };
    }

    function getPreparedResults() {
      return currentResults.map(prepareResult);
    }

    function updateSeasonOptions() {
      const select = document.getElementById('season-filter');
      const selected = select.value;
      const seasons = [...new Set(
        getPreparedResults()
          .map((item) => item._season)
          .filter((season) => season > 0)
      )].sort((a, b) => a - b);

      select.innerHTML = '<option value="">Todas as temporadas</option>' +
        seasons.map((season) => `<option value="${season}">Temporada ${season}</option>`).join('');
      if (seasons.includes(Number(selected))) {
        select.value = selected;
      }
    }

    function compareResults(a, b) {
      const sortBy = document.getElementById('sort-by').value;
      if (sortBy === 'date') {
        return new Date(b.date || 0) - new Date(a.date || 0);
      }
      if (sortBy === 'title') {
        return (a.title || '').localeCompare(b.title || '');
      }
      if (sortBy === 'season') {
        return (a._season - b._season) ||
          (a._episode - b._episode) ||
          ((b.seed_count || 0) - (a.seed_count || 0));
      }
      return (b.seed_count || 0) - (a.seed_count || 0);
    }

    function renderResults() {
      const resultsContainer = document.getElementById('results');
      const seasonFilter = Number(document.getElementById('season-filter').value || 0);
      let results = getPreparedResults();

      if (seasonFilter > 0) {
        results = results.filter((item) => item._season === seasonFilter);
      }
      results.sort(compareResults);

      if (results.length === 0) {
        const onlyWithSeeds = document.getElementById('only-with-seeds').checked;
        const hint = onlyWithSeeds
          ? 'Nenhum resultado com seeds. Desmarque "Only with seeds" para ver todos.'
          : 'Try different search terms or check spelling';
        resultsContainer.innerHTML = `
          <div class="p-6 bg-gray-800 rounded-lg shadow-md text-center">
            <p class="text-xl font-bold text-gray-400">No results found</p>
            <p class="text-gray-500 mt-2">${hint}</p>
          </div>
        `;
        return;
      }

      const groups = new Map();
      for (const item of results) {
        const key = item._season || 0;
        if (!groups.has(key)) {
          groups.set(key, []);
        }
        groups.get(key).push(item);
      }

      const groupKeys = [...groups.keys()].sort((a, b) => a - b);
      let html = currentIsLive
        ? `<div class="p-4 bg-gray-800 rounded-lg shadow-md text-center mb-2">
             <p class="text-gray-300">Resultados ao vivo dos indexers. Eles também foram indexados para as próximas buscas.</p>
           </div>`
        : '';

      for (const key of groupKeys) {
        const label = key ? `Temporada ${key}` : 'Outros';
        const sortBy = document.getElementById('sort-by').value;
        const items = groups.get(key).slice().sort((a, b) => {
          if (sortBy === 'date' || sortBy === 'title') {
            return compareResults(a, b);
          }
          if (a._episode && b._episode && a._episode !== b._episode) {
            return a._episode - b._episode;
          }
          if (a._episode && !b._episode) {
            return -1;
          }
          if (!a._episode && b._episode) {
            return 1;
          }
          return (b.seed_count || 0) - (a.seed_count || 0);
        });

        html += `<h3 class="text-xl font-bold text-white mt-6 mb-2">${label}</h3>` +
          items.map(renderTorrent).join('');
      }

      resultsContainer.innerHTML = html;
    }

    // Handle search
    async function onSearch() {
      const query = document.getElementById('search-query').value.trim();
      if (!query) {
        alert('Please enter a search query!');
        return;
      }

      const resultsContainer = document.getElementById('results');
      const onlyWithSeeds = document.getElementById('only-with-seeds').checked;
      const minSeedsParam = onlyWithSeeds ? '&min_seeds=1' : '';

      try {
        const response = await fetch(`/search?q=${encodeURIComponent(query)}&limit=50${minSeedsParam}`);
        if (!response.ok) {
          throw new Error('Search failed');
        }

        const data = await response.json();
        const cachedResults = data.results || data;

        if (cachedResults.length > 0) {
          currentResults = cachedResults;
          currentIsLive = false;
          updateSeasonOptions();
          renderResults();
          return;
        }

        showLoading('Buscando ao vivo nos indexers...');
        const liveResults = await liveSearch(query, onlyWithSeeds);
        currentResults = liveResults;
        currentIsLive = true;
        updateSeasonOptions();
        renderResults();
      } catch (error) {
        resultsContainer.innerHTML = `
          <div class="p-6 bg-red-800 rounded-lg shadow-md text-center">
            <p class="text-xl font-bold text-red-400">Error fetching search results</p>
            <p class="text-gray-400 mt-2">Please try again later.</p>
          </div>
        `;
        console.error(error);
      }
    }
    
    // Event listeners
    document.getElementById('search-btn').addEventListener('click', onSearch);
    document.getElementById('search-query').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        onSearch();
      }
    });
    document.getElementById('sort-by').addEventListener('change', renderResults);
    document.getElementById('season-filter').addEventListener('change', renderResults);
    document.getElementById('only-with-seeds').addEventListener('change', onSearch);

    // Initialize page
    document.addEventListener('DOMContentLoaded', async () => {
      await checkHealth();
      await loadStats();
      
      // Refresh health and stats periodically
      setInterval(checkHealth, 30000); // Check health every 30 seconds
      setInterval(loadStats, 60000);   // Update stats every minute
    });
  </script>
</body>

</html>
