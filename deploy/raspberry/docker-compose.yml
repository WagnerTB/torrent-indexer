name: media

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  torrent-indexer:
    build:
      context: ./torrent-indexer
      dockerfile_inline: |
        FROM alpine:latest
        RUN apk add --no-cache ca-certificates tzdata
        WORKDIR /app
        COPY torrent-indexer-linux-arm64 /app/torrent-indexer
        RUN chmod +x /app/torrent-indexer
        CMD ["/app/torrent-indexer"]
    image: media/torrent-indexer:local
    restart: unless-stopped
    ports:
      - "8080:7006"
      - "${LAN_IP}:8081:8081"
    environment:
      TZ: ${TZ}
      LOG_LEVEL: 1
      PORT: 7006
      METRICS_PORT: 8081
      REDIS_HOST: redis
      MEILISEARCH_ADDRESS: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY}
      FLARESOLVERR_ADDRESS: http://solvearr:8191
      FLARESOLVERR_POOL_SIZE: 2
      FLARESOLVERR_TIMEOUT_SECONDS: 180
      FLARESOLVERR_USE_SESSIONS: "true"
      REQUEST_TIMEOUT_MILLISECONDS: 10000
    depends_on:
      - redis
      - meilisearch
      - solvearr
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7006/search/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true
    mem_limit: 256m
    logging: *default-logging
    networks: [media]

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - autoheal=true
    mem_limit: 192m
    logging: *default-logging
    networks: [media]

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true
    mem_limit: 512m
    logging: *default-logging
    networks: [media]

  solvearr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
      CAPTCHA_SOLVER: none
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191/health >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    mem_limit: 1024m
    logging: *default-logging
    networks: [media]

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8082
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${MEDIA_ROOT}:/media
      - ${DOWNLOAD_ROOT}:/media/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/ >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    ports:
      - "${LAN_IP}:8082:8082"
      - "6881:6881"
      - "6881:6881/udp"
    mem_limit: 512m
    logging: *default-logging
    networks: [media]

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr2:/config
      - ${MEDIA_ROOT}:/media
      - ${DOWNLOAD_ROOT}:/media/downloads
    ports:
      - "${LAN_IP}:8989:8989"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/ping >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      - autoheal=true
    mem_limit: 512m
    logging: *default-logging
    networks: [media]

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - "${LAN_IP}:9696:9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    mem_limit: 384m
    logging: *default-logging
    networks: [media]

  bazarr:
    image: linuxserver/bazarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${MEDIA_ROOT}:/media
      - ${DOWNLOAD_ROOT}:/media/downloads
    ports:
      - "${LAN_IP}:6767:6767"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6767/ >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    mem_limit: 384m
    logging: *default-logging
    networks: [media]

  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      JELLYFIN_DATA_DIR: /config
      JELLYFIN_CACHE_DIR: /cache
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${CONFIG_ROOT}/jellyfin-cache:/cache
      - ${MEDIA_ROOT}:/media
      - ${DOWNLOAD_ROOT}:/media/downloads
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD-SHELL", "curl --noproxy '*' -fsS http://127.0.0.1:8096/health >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - autoheal=true
    mem_limit: 1536m
    logging: *default-logging
    networks: [media]

  stremio-server:
    image: stremio/server:latest
    restart: unless-stopped
    environment:
      NO_CORS: "1"
      CASTING_DISABLED: "1"
    volumes:
      - ${MEDIA_ROOT}/stremio-server:/root/.stremio-server
    ports:
      - "11470:11470"
      - "12470:12470"
    mem_limit: 256m
    logging: *default-logging
    networks: [media]

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/homepage:/app/config
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider -Y off http://127.0.0.1:3000/api/healthcheck || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true
    mem_limit: 384m
    logging: *default-logging
    networks: [media]

  gaming-agent:
    image: python:3.12-alpine
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
    environment:
      PC_IP: ${PC_IP:?set PC_IP in .env}
      PC_MAC: ${PC_MAC:?set PC_MAC in .env}
      LISTEN_PORT: "8100"
      LISTEN_HOST: ${LAN_IP:?set LAN_IP in .env}
      PUBLIC_PORT: "8098"
      GAMING_PASSWORD_FILE: /app/.gaming_password
      GAMING_PASSWORD: ${GAMING_PASSWORD:?set GAMING_PASSWORD in .env}
      BROADCAST: ${LAN_BROADCAST:?set LAN_BROADCAST in .env}
    volumes:
      - ${CONFIG_ROOT}/gaming-agent:/app:ro
    command: ["python3", "/app/agent.py"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8098/gaming/status || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true
    mem_limit: 64m
    logging: *default-logging

  media-agent:
    build: ${CONFIG_ROOT}/media-agent
    image: media-agent:local
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN_PORT: "8097"
      LISTEN_HOST: 0.0.0.0
      ALLOWED_NETWORKS: ${ALLOWED_NETWORKS:?set ALLOWED_NETWORKS in .env}
      BAZARR_CONFIG: /bazarr/config.yaml
      BAZARR_URL: http://${LAN_IP}:6767
      BAZARR_KEY_FILE: /app/.bazarr_key
      RADARR_URL: http://${LAN_IP}:7878
      SONARR_URL: http://${LAN_IP}:8989
      RADARR_CONFIG: /radarr/config.xml
      SONARR_CONFIG: /sonarr/config.xml
      SEERR_URL: http://${LAN_IP}:5055
      SEERR_CONFIG: /seerr/settings.json
      RADARR_DUBBED_PROFILE: "8"
      SONARR_DUBBED_PROFILE: "9"
      RADARR_ORIGINAL_PROFILE: "7"
      SONARR_ORIGINAL_PROFILE: "7"
      RADARR_ANIME_LEGENDADO_PROFILE: "9"
      RADARR_ANIME_DUBBED_PROFILE: "10"
      SONARR_ANIME_LEGENDADO_PROFILE: "8"
      SONARR_ANIME_DUBBED_PROFILE: "10"
      STATE_DIR: /state
      OS_API_KEY: ${OS_API_KEY:-}
      STORAGE_CONFIG: '[{"id":"media","label":"Mídia 2TB","kind":"SSD","parts":[{"label":"Mídia","path":"/media"}]},{"id":"downloads","label":"Downloads 640GB","kind":"SSD","parts":[{"label":"Downloads","path":"/media/downloads"}]},{"id":"ssd01","label":"SSD 01","kind":"SSD","parts":[{"label":"Mídia","path":"/host/pimedia-probe"},{"label":"Docker","path":"/"}]},{"id":"system","label":"Sistema","kind":"microSD","parts":[{"label":"Sistema","path":"/host/root-probe"}]}]'
    volumes:
      - ${CONFIG_ROOT}/media-agent:/app:ro
      - ${CONFIG_ROOT}/media-agent/state:/state
      - ${CONFIG_ROOT}/media-agent/.storage-probe:/host/pimedia-probe:ro
      - /etc/hostname:/host/root-probe:ro
      - ${CONFIG_ROOT}/bazarr/config/config.yaml:/bazarr/config.yaml:ro
      - ${CONFIG_ROOT}/radarr/config.xml:/radarr/config.xml:ro
      - ${CONFIG_ROOT}/sonarr2/config.xml:/sonarr/config.xml:ro
      - ${CONFIG_ROOT}/seerr:/seerr:ro
      - ${MEDIA_ROOT}:/media:ro
      - ${DOWNLOAD_ROOT}:/media/downloads:ro
      - /srv/media/.migration-status.json:/migration/status.json:ro
    command: ["python3", "/app/media_agent.py"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('127.0.0.1',8097),3).close()\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    mem_limit: 128m
    logging: *default-logging

  # BFF /api/v1 do app da família (plans/PLANO_APP_NATIVO_JELLYFIN.md).
  # Mesma imagem e mesmo /app do media-agent; processo separado de propósito.
  # 8099 = público, preso a 127.0.0.1 (só o cloudflared enxerga).
  # 8091 = rotas públicas na LAN (app em casa); 8092 = admin (só LAN).
  media-bff:
    image: media-agent:local
    restart: unless-stopped
    network_mode: host
    environment:
      V1_STATE_DIR: /state
      JELLYFIN_URL: http://127.0.0.1:8096
      SEERR_URL: http://127.0.0.1:5055
      MEDIA_AGENT_URL: http://127.0.0.1:8097
      RADARR_URL: http://${LAN_IP}:7878
      SONARR_URL: http://${LAN_IP}:8989
      BAZARR_URL: http://${LAN_IP}:6767
      PROWLARR_URL: http://${LAN_IP}:9696
      QBITTORRENT_URL: http://${LAN_IP}:8082
      GAMING_URL: http://${LAN_IP}:8100
      ALLOWED_NETWORKS: ${ALLOWED_NETWORKS:?set ALLOWED_NETWORKS in .env}
      V1_TOKEN_TTL: "3600"
      V1_LOG_LEVEL: INFO
    volumes:
      - ${CONFIG_ROOT}/media-agent:/app:ro
      - media-bff-state:/state
    command:
      - python3
      - /app/api_v1.py
      - --host
      - 127.0.0.1
      - --port
      - "8099"
      - --admin-host
      - ${LAN_IP}
      - --admin-port
      - "8092"
      - --lan-host
      - ${LAN_IP}
      - --lan-port
      - "8091"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('127.0.0.1',8099),3).close()\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true
    mem_limit: 96m
    logging: *default-logging


  media-gateway:
    image: python:3.12-alpine
    restart: unless-stopped
    environment:
      LISTEN_PORT: "8099"
      RADARR_DB: /radarr/radarr.db
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_CONFIG: /prowlarr/config.xml
      TORZNAB_API_KEY: alternate
      TORZNAB_BRAZIL_INDEXERS: "Rede Torrent,Torrent dos Filmes,Starck Filmes,Comando Torrents"
    volumes:
      - ${CONFIG_ROOT}/media-gateway:/app:ro
      - ${CONFIG_ROOT}/radarr:/radarr:ro
      - ${CONFIG_ROOT}/prowlarr/config.xml:/prowlarr/config.xml:ro
    command: ["python3", "/app/gateway.py"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('127.0.0.1',8099),3).close()\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true
    mem_limit: 128m
    logging: *default-logging
    networks: [media]

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${MEDIA_ROOT}:/media
      - ${DOWNLOAD_ROOT}:/media/downloads
    ports:
      - "${LAN_IP}:7878:7878"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7878/ping >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      - autoheal=true
    mem_limit: 384m
    logging: *default-logging
    networks: [media]

  seerr:
    image: seerr/seerr:latest
    init: true
    container_name: seerr
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}
      PORT: "5055"
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
    ports:
      - "5055:5055"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1"]
      start_period: 120s
      timeout: 5s
      interval: 20s
      retries: 5
    labels:
      - autoheal=true
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    mem_limit: 384m
    logging: *default-logging
    networks: [media]

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "120"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "30"
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges
    mem_limit: 32m
    logging: *default-logging
    networks: [media]

  # Proxy restrito do Docker para o admin-agent. Só a rede interna
  # `admin-internal` alcança; não publica porta e não libera exec/imagens/
  # volumes/redes. O admin-agent é o único consumidor.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:be1ac64f33bd82043beb504822a17ba6b71668ea1ad7cf51a9a01d27bb7ab047
    container_name: admin-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      ALLOW_RESTARTS: "1"
      EVENTS: "0"
      PING: "0"
      VERSION: "0"
      AUTH: "0"
      SECRETS: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      GRPC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "0"
      NODES: "0"
      PLUGINS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
      LOG_LEVEL: "warning"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges
    mem_limit: 64m
    logging: *default-logging
    networks: [admin-internal]

  # Administração LAN-only: lista/start/stop/restart dos containers do projeto
  # `media`. Não lê compose, .env nem arquivos de configuração.
  admin-agent:
    build: ${CONFIG_ROOT}/admin-agent
    image: admin-agent:local
    container_name: admin-agent
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    environment:
      TZ: ${TZ}
      LISTEN_PORT: "8093"
      LISTEN_HOST: "0.0.0.0"
      ADMIN_ALLOWED_NETWORKS: "127.0.0.0/8,::1/128,${ADMIN_LAN_SUBNET:?set ADMIN_LAN_SUBNET in .env}"
      ADMIN_ALLOWED_ORIGINS: "http://${LAN_IP}:3000,http://localhost:3000,http://127.0.0.1:3000"
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      DOCKER_URL: http://docker-socket-proxy:2375
      COMPOSE_PROJECT: media
      AUDIT_FILE: /state/admin-audit.jsonl
    volumes:
      - ${CONFIG_ROOT}/admin-agent:/app:ro
      - ${ADMIN_PASSWORD_PATH:?set ADMIN_PASSWORD_PATH in .env}:/run/secrets/admin_password:ro
      - ${CONFIG_ROOT}/admin-agent/state:/state
    tmpfs:
      - /tmp
    ports:
      - "${LAN_IP}:8093:8093"
    depends_on:
      - docker-socket-proxy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/health', timeout=3)\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - autoheal=true
    mem_limit: 64m
    logging: *default-logging
    networks: [admin-edge, admin-internal]

volumes:
  redis-data:
  meili-data:
  media-bff-state:
networks:
  media:
  admin-internal:
    internal: true
  admin-edge:




